[package]
name = "leash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Leash: a policy-enforced NEAR wallet for AI agents"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
